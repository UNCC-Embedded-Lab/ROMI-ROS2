###############################################################################
# nav2_amcl + nav2_map_server parameters for the Romi robot
# Used by romi_amcl.launch.py
###############################################################################

amcl:
  ros__parameters:
    use_sim_time: true

    # ── Motion model ──────────────────────────────────────────────────────────
    # Differential-drive model (matches the Romi's drive type).
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Noise in rotation caused by rotation (rad/rad)
    alpha1: 0.2
    # Noise in rotation caused by translation (rad/m)
    alpha2: 0.2
    # Noise in translation caused by translation (m/m)
    alpha3: 0.2
    # Noise in translation caused by rotation (m/rad)
    alpha4: 0.2

    # ── Frames ────────────────────────────────────────────────────────────────
    base_frame_id: base_link       # frame the diff-drive plugin publishes odom→
    odom_frame_id: odom
    global_frame_id: map           # AMCL publishes the map→odom correction here
    transform_tolerance: 0.5       # seconds — generous for sim timing jitter

    # ── Laser model ───────────────────────────────────────────────────────────
    laser_model_type: likelihood_field
    laser_max_range: 12.0          # RPLidar A1 max range (m)
    laser_min_range: 0.05
    max_beams: 60                  # beams sampled per update (lower = faster)

    # Likelihood-field parameters
    sigma_hit: 0.2                 # std dev of Gaussian around expected hit (m)
    z_hit: 0.5                     # weight for hit model
    z_rand: 0.5                    # weight for random model
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    likelihood_field_dsmax: 2.0    # max obstacle distance used in field (m)

    # ── Particle filter ───────────────────────────────────────────────────────
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05                   # desired error in KLD sampling
    pf_z: 0.99                     # desired confidence in KLD sampling

    # ── Update thresholds ─────────────────────────────────────────────────────
    # Only run the filter when the robot has moved enough — avoids wasting CPU
    # while stationary and prevents filter divergence from encoder noise.
    update_min_d: 0.05             # minimum translation before update (m)
    update_min_a: 0.1              # minimum rotation before update (rad, ~6°)
    resample_interval: 1           # resample every N filter updates

    # ── Slow/fast average for particle injection (recovery) ───────────────────
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # ── Initial pose ──────────────────────────────────────────────────────────
    # Robot spawns at the world origin (centre of the hallway) facing +X.
    # Setting this avoids needing to send a "2D Pose Estimate" in RViz first.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # ── Topics ────────────────────────────────────────────────────────────────
    scan_topic: /scan
    map_topic: /map
    save_pose_rate: 0.5            # Hz — how often to save last known pose

# map_server parameters — yaml_filename is overridden at launch time
# with the absolute path to romi_office_map.yaml.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""              # set by romi_amcl.launch.py

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['map_server', 'amcl']
